name: Build Android APK

# Compile l'app web en APK Android (via Capacitor) sur les serveurs GitHub,
# puis la publie en téléchargement direct. L'APK embarque tout le contenu :
# elle fonctionne hors-ligne, sans lien internet.

on:
  push:
    branches: ["claude/improve-app-experience-phl9il", "main"]
    tags: ["v*"]
  workflow_dispatch: {} # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write # nécessaire pour publier l'APK dans une Release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Clé Capgo pour les mises à jour web silencieuses (OTA). Optionnelle :
      # si le secret CAPGO_TOKEN n'est pas défini, l'étape OTA est ignorée.
      CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Le runner ubuntu-latest fournit déjà le SDK Android (ANDROID_HOME),
      # licences acceptées. Pas besoin de android-actions/setup-android
      # (qui échoue en tentant d'installer le paquet déprécié « tools »).

      - name: Install dependencies
        run: npm install

      - name: Assemble web assets (www/)
        run: npm run build:web

      - name: Publier le bundle OTA (Capgo, si configuré)
        if: ${{ env.CAPGO_TOKEN != '' }}
        continue-on-error: true # ne jamais bloquer l'APK si Capgo est mal configuré
        run: >-
          npx -y @capgo/cli@latest bundle upload
          -a "$CAPGO_TOKEN"
          --channel production
          --path www
          --bundle "1.0.${{ github.run_number }}"

      - name: Add Android platform
        run: npx cap add android

      - name: Monter compileSdk 35 + AGP 8.6 + Gradle 8.7
        # Certains plugins (Capgo) requièrent compileSdk 35 ; Capacitor 6
        # génère le projet en SDK 34 / AGP 8.2.1 (max 34). On aligne le tout.
        run: |
          sed -i -E "s/(compileSdkVersion = )[0-9]+/\135/; s/(targetSdkVersion = )[0-9]+/\135/" android/variables.gradle
          sed -i -E "s#(com\.android\.tools\.build:gradle:)[0-9.]+#\18.6.0#" android/build.gradle
          sed -i -E "s#(gradle-)[0-9.]+(-all\.zip)#\18.7\2#" android/gradle/wrapper/gradle-wrapper.properties
          echo "--- variables.gradle ---"; grep -E "compileSdkVersion|targetSdkVersion" android/variables.gradle
          echo "--- build.gradle (AGP) ---"; grep "com.android.tools.build:gradle" android/build.gradle
          echo "--- gradle wrapper ---"; grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Versionner l'app (versionCode/versionName)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk culture-g.apk

      - name: Écrire app-version.json (pour le bandeau de MAJ)
        run: |
          cat > app-version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/EmilyGuindi/Culture-G/releases/download/android-latest/culture-g.apk",
            "build": "${{ github.sha }}"
          }
          JSON
          cat app-version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: culture-g-apk
          path: culture-g.apk
          if-no-files-found: error

      - name: Publish APK (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Culture G — APK Android (dernière version)"
          prerelease: true
          body: |
            Dernière APK de **Culture G**, générée automatiquement.

            **Installer sur ton téléphone Android :**
            1. Ouvre ce lien depuis ton tel et télécharge `culture-g.apk`.
            2. Ouvre le fichier téléchargé.
            3. Si Android le demande, autorise « installer des applis inconnues »
               pour ton navigateur/gestionnaire de fichiers, puis installe.

            L'app fonctionne hors-ligne. La génération de leçons par IA
            (optionnelle) nécessite internet + une clé API.

            L'app se met à jour toute seule pour les changements de contenu
            (OTA). Pour les mises à jour natives, elle affiche un bandeau
            « Mettre à jour » — un seul tap suffit.

            _Build : 1.0.${{ github.run_number }} (${{ github.sha }})_
          files: |
            culture-g.apk
            app-version.json
