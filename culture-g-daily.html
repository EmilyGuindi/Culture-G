<style>
/* =========================================================
   Culture G Daily — Design System
   Ambiance : éducative moderne, premium, minimaliste, éditoriale
   ========================================================= */

:root {
  /* Palette */
  --cream: #F7F2E9;
  --cream-soft: #FBF8F1;
  --card: #FFFFFF;
  --ink: #23262B;          /* anthracite */
  --ink-soft: #4A4E56;
  --ink-faint: #8A8F98;
  --line: #EAE3D6;
  --navy: #223A5E;         /* bleu nuit */
  --navy-deep: #1B2E4A;
  --gold: #C6A15B;         /* doré */
  --gold-soft: #E9DCC0;
  --success: #3E8E6E;
  --danger: #C25B54;

  /* Typo */
  --font-editorial: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  /* Espacement & rayons */
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow-soft: 0 10px 30px -18px rgba(34, 58, 94, 0.35);
  --shadow-card: 0 18px 40px -26px rgba(27, 46, 74, 0.45);

  --maxw: 520px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.55;
}

/* ---------- Shell & layout ---------- */

.app-shell {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background:
    radial-gradient(120% 60% at 50% -10%, #FBF7EE 0%, var(--cream) 60%);
}

.view {
  width: 100%;
  max-width: var(--maxw);
  padding: 22px 20px calc(96px + env(safe-area-inset-bottom));
  flex: 1;
}

/* ---------- Typographie ---------- */

h1, h2, h3 { font-family: var(--font-editorial); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.eyebrow {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-weight: 600;
  color: var(--gold);
}
.muted { color: var(--ink-faint); }

/* ---------- Header commun ---------- */

.page-head { margin-bottom: 22px; }
.page-head h1 { font-size: 1.9rem; line-height: 1.15; margin-top: 6px; }
.page-head p { color: var(--ink-soft); margin: 6px 0 0; }

/* ---------- Cartes ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-soft);
}

/* Carte "Leçon du jour" — mise en avant */
.hero-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(155deg, var(--navy) 0%, var(--navy-deep) 100%);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-card);
}
.hero-card::after {
  content: "";
  position: absolute;
  width: 220px; height: 220px;
  right: -70px; top: -90px;
  background: radial-gradient(circle, rgba(198,161,91,0.35), transparent 70%);
}
.hero-card .eyebrow { color: var(--gold-soft); }
.hero-card h2 { font-size: 1.5rem; margin: 10px 0 6px; color: #fff; }
.hero-card .hero-cat { font-size: 0.85rem; color: rgba(255,255,255,0.72); }
.hero-card .hero-preview { margin: 14px 0 0; color: rgba(255,255,255,0.82); font-size: 0.95rem; }

/* ---------- Boutons ---------- */

.btn {
  appearance: none;
  border: none;
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 1rem;
  border-radius: 999px;
  padding: 14px 22px;
  width: 100%;
  transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.btn:active { transform: translateY(1px) scale(0.995); }
.btn-primary { background: var(--gold); color: #2a2410; box-shadow: 0 10px 22px -12px rgba(198,161,91,0.9); }
.btn-primary:hover { background: #d0ac66; }
.btn-navy { background: #fff; color: var(--navy); }
.btn-navy:hover { background: #f4efe4; }
.btn-outline { background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
.btn-outline:hover { background: var(--cream-soft); }
.btn-ghost { background: transparent; color: var(--ink-soft); width: auto; padding: 10px 6px; }
.btn-row { display: grid; gap: 10px; margin-top: 16px; }
.btn.small { width: auto; padding: 10px 18px; font-size: 0.9rem; }

/* ---------- Stats / streak / progression ---------- */

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-soft);
}
.stat .stat-value { font-family: var(--font-editorial); font-size: 1.7rem; font-weight: 600; color: var(--navy); }
.stat .stat-label { font-size: 0.78rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }
.stat .flame { color: var(--gold); }

/* Progression hebdo */
.week { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.day {
  flex: 1;
  text-align: center;
  font-size: 0.72rem;
  color: var(--ink-faint);
}
.day .dot {
  width: 30px; height: 30px;
  margin: 0 auto 6px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600;
  color: var(--ink-faint);
  background: var(--cream-soft);
}
.day.done .dot { background: var(--navy); color: #fff; border-color: var(--navy); }
.day.today .dot { border-color: var(--gold); color: var(--navy); box-shadow: 0 0 0 3px rgba(198,161,91,0.18); }

/* Barre de progression */
.progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--navy), var(--gold)); border-radius: 999px; transition: width 0.4s ease; }

/* ---------- Section leçon (lecture) ---------- */

.lesson-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.chip {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--gold-soft);
  color: #6b5320;
}
.lesson-title { font-size: 1.7rem; line-height: 1.2; margin: 6px 0 4px; }
.lesson-body { margin-top: 18px; font-size: 1.02rem; color: var(--ink-soft); }
.lesson-body p { margin: 0 0 14px; }
.lesson-body p:first-letter { }

.callout {
  border-radius: var(--radius-md);
  padding: 16px 18px;
  margin: 18px 0;
  border: 1px solid var(--line);
}
.callout .callout-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.callout p { margin: 0; }
.callout.retenir { background: #F3F6FA; border-color: #DCE6F1; }
.callout.retenir .callout-title { color: var(--navy); }
.callout.stylé { background: #FBF4E4; border-color: var(--gold-soft); }
.callout.stylé .callout-title { color: #8a6a24; }

/* ---------- Quiz ---------- */

.quiz-progress { font-size: 0.8rem; color: var(--ink-faint); letter-spacing: 0.06em; text-transform: uppercase; }
.question { font-family: var(--font-editorial); font-size: 1.35rem; line-height: 1.3; margin: 12px 0 20px; }
.options { display: grid; gap: 12px; }
.option {
  text-align: left;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 15px 16px;
  font-size: 1rem;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  display: flex; align-items: center; gap: 12px;
}
.option .marker {
  width: 26px; height: 26px; flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; color: var(--ink-faint);
}
.option:not(:disabled):hover { border-color: var(--navy); }
.option.correct { border-color: var(--success); background: #EEF7F2; }
.option.correct .marker { background: var(--success); color: #fff; border-color: var(--success); }
.option.wrong { border-color: var(--danger); background: #FBEEED; }
.option.wrong .marker { background: var(--danger); color: #fff; border-color: var(--danger); }
.option:disabled { cursor: default; }

.feedback {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  animation: rise 0.3s ease;
}
.feedback.ok { background: #EEF7F2; color: #2c6a52; border: 1px solid #cfe8dc; }
.feedback.ko { background: #FBEEED; color: #9c4a44; border: 1px solid #f0d6d3; }

/* Écran score */
.score-ring {
  width: 150px; height: 150px; margin: 8px auto 4px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--gold) var(--pct, 0%), var(--line) 0);
}
.score-ring .inner {
  width: 120px; height: 120px; border-radius: 50%;
  background: var(--cream);
  display: grid; place-items: center; text-align: center;
}
.score-ring .num { font-family: var(--font-editorial); font-size: 2rem; font-weight: 600; color: var(--navy); }

/* ---------- Bibliothèque ---------- */

.filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; margin: 0 -4px 6px; -webkit-overflow-scrolling: touch; }
.filter-row::-webkit-scrollbar { display: none; }
.filter {
  flex: none;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 0.85rem; font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.filter.active { background: var(--navy); color: #fff; border-color: var(--navy); }

.topic-list { display: grid; gap: 12px; }
.topic {
  display: flex; align-items: center; gap: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: transform 0.12s ease, box-shadow 0.2s ease;
}
.topic:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
.topic .ic { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 1.2rem; background: var(--cream-soft); border: 1px solid var(--line); }
.topic .t-main { flex: 1; min-width: 0; }
.topic .t-title { font-weight: 600; font-family: var(--font-editorial); font-size: 1.05rem; }
.topic .t-cat { font-size: 0.78rem; color: var(--ink-faint); }
.status {
  font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
}
.status.todo { background: var(--cream-soft); color: var(--ink-faint); border: 1px solid var(--line); }
.status.progress { background: #FBF4E4; color: #8a6a24; }
.status.mastered { background: #EEF7F2; color: #2c6a52; }

/* ---------- Profil ---------- */

.profile-hero { text-align: center; padding: 26px 20px; }
.avatar {
  width: 76px; height: 76px; margin: 0 auto 12px;
  border-radius: 50%;
  background: linear-gradient(155deg, var(--navy), var(--navy-deep));
  color: var(--gold);
  display: grid; place-items: center;
  font-family: var(--font-editorial); font-size: 1.8rem; font-weight: 700;
}
.themes { display: grid; gap: 10px; margin-top: 12px; }
.theme-row { display: flex; align-items: center; gap: 12px; }
.theme-row .t-name { width: 108px; flex: none; font-size: 0.9rem; }
.theme-row .bar { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.theme-row .bar > span { display: block; height: 100%; border-radius: 999px; }
.theme-row .pct { width: 42px; text-align: right; font-size: 0.82rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: none; }

/* ---------- Tab bar ---------- */

.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  justify-content: space-around;
  background: rgba(251,248,241,0.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
}
.tab {
  flex: 1;
  max-width: 100px;
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-faint);
  font-size: 0.68rem; font-weight: 600;
  padding: 6px 0;
}
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--navy); }
.tab.active svg { stroke: var(--navy); }

/* ---------- Section title ---------- */
.section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); margin: 26px 0 12px; }

/* ---------- Utilitaires ---------- */
.stack > * + * { margin-top: 14px; }
.center { text-align: center; }
.hidden { display: none !important; }

/* ---------- Animations de transition de page ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.view-enter { animation: rise 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
.stagger > * { animation: rise 0.4s both cubic-bezier(0.22, 1, 0.36, 1); }
.stagger > *:nth-child(1) { animation-delay: 0.02s; }
.stagger > *:nth-child(2) { animation-delay: 0.08s; }
.stagger > *:nth-child(3) { animation-delay: 0.14s; }
.stagger > *:nth-child(4) { animation-delay: 0.20s; }
.stagger > *:nth-child(5) { animation-delay: 0.26s; }
.stagger > *:nth-child(6) { animation-delay: 0.32s; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- Desktop ---------- */
@media (min-width: 720px) {
  :root { --maxw: 620px; }
  .app-shell { background: radial-gradient(120% 50% at 50% -20%, #FBF7EE 0%, var(--cream) 55%); }
  .view { padding-top: 40px; }
  .page-head h1 { font-size: 2.2rem; }
}

</style>

(function () {

 */

const CATEGORIES = [
  { id: "histoire", label: "Histoire", icon: "🏛️" },

];

const LESSONS = [
  {

    title: "Le siècle des Lumières",
    category: "histoire",
    minutes: 5,
    summary: "Comment un mouvement d'idées a redessiné l'Europe et posé les bases du monde moderne.",
    body: [
      "Le XVIIIe siècle européen est traversé par un courant intellectuel d'une ambition inédite : les Lumières. Derrière ce nom se cache une conviction simple mais radicale pour l'époque — la raison humaine, et non la tradition ou l'autorité religieuse, doit être la boussole qui guide la société. Penseurs, savants et écrivains se donnent pour mission d'« éclairer » leurs contemporains en combattant l'ignorance, la superstition et l'arbitraire du pouvoir.",
      "En France, ce mouvement prend un visage collectif avec l'Encyclopédie, dirigée par Diderot et d'Alembert. Publiée entre 1751 et 1772, elle rassemble le savoir de son temps en des milliers d'articles rédigés par les meilleurs esprits. Bien plus qu'un dictionnaire, c'est une machine de guerre intellectuelle : sous couvert de définir des mots, elle diffuse discrètement des idées critiques sur la religion, la monarchie et les privilèges.",
      "Les figures des Lumières ne forment pas un bloc uniforme. Voltaire manie l'ironie pour dénoncer l'intolérance et défendre la liberté d'expression. Montesquieu, dans « De l'esprit des lois », théorise la séparation des pouvoirs — exécutif, législatif, judiciaire — un principe qui structure encore aujourd'hui la plupart des démocraties. Rousseau, lui, s'écarte du groupe en interrogeant les inégalités sociales et en imaginant, avec le « Contrat social », une souveraineté fondée sur la volonté du peuple.",
      "Ces idées ne restent pas confinées aux salons parisiens. Elles circulent dans toute l'Europe, portées par la correspondance, les cafés et les cercles savants. Des souverains eux-mêmes, comme Frédéric II de Prusse ou Catherine II de Russie, se réclament du « despotisme éclairé », tentant de moderniser leurs États tout en conservant leur pouvoir absolu — un équilibre souvent plus théorique que réel.",
      "L'héritage des Lumières est immense. On leur doit la formulation de droits universels, l'idée que la connaissance doit être partagée, et la confiance dans le progrès. La Déclaration d'indépendance américaine (1776) comme la Déclaration des droits de l'homme et du citoyen (1789) puisent directement dans ce vocabulaire de la raison et de la liberté. Sans les Lumières, difficile d'imaginer la démocratie moderne telle que nous la connaissons.",
      "Mais l'époque a aussi ses zones d'ombre. La foi dans la raison a parfois viré à l'excès de confiance, et certains penseurs des Lumières ont défendu des hiérarchies entre les peuples qui nourriront plus tard des idéologies problématiques. Comprendre les Lumières, c'est donc saisir à la fois un formidable élan émancipateur et les tensions qu'il portait en germe.",
    ],
    retenir:

    quiz: [
      {

        options: ["Voltaire", "Montesquieu", "Rousseau", "Diderot"],
        answer: 1,
        explain: "Montesquieu développe ce principe dans « De l'esprit des lois » (1748).",

      {

  {
    id: "detroits-strategiques",
    title: "Les détroits, verrous du monde",
    category: "geopolitique",
    minutes: 5,
    summary: "Pourquoi quelques kilomètres de mer suffisent à faire trembler l'économie mondiale.",
    body: [
      "Regardez une carte du commerce maritime : elle ressemble à un réseau de veines où circule le sang de l'économie mondiale. Environ 80 % des marchandises voyagent par la mer. Or, sur ces routes, quelques passages étroits — les détroits — concentrent un pouvoir démesuré. Les contrôler, c'est tenir un robinet sur le flux mondial du pétrole, des céréales ou des conteneurs.",
      "Le détroit d'Ormuz, entre l'Iran et la péninsule Arabique, en est l'exemple le plus tendu. Chaque jour, près d'un cinquième du pétrole consommé dans le monde y transite. Sa largeur navigable ne dépasse guère quelques kilomètres. La moindre tension régionale y fait grimper les cours du brut, car les marchés redoutent une fermeture, même temporaire.",
      "Plus à l'est, le détroit de Malacca relie l'océan Indien à la mer de Chine méridionale. C'est l'artère vitale du commerce asiatique : la majeure partie des importations énergétiques de la Chine, du Japon et de la Corée du Sud y passe. Sa congestion et sa vulnérabilité à la piraterie en font un point de fixation stratégique, au point que Pékin cherche des routes alternatives par voie terrestre.",

/** Renvoie la leçon du jour de façon déterministe (change chaque jour). */
function pickDailyLessonId(dateStr) {
  // dateStr au format YYYY-MM-DD → index stable dans la journée
  const seed = dateStr.split("-").reduce((acc, n) => acc + parseInt(n, 10), 0);
  return LESSONS[seed % LESSONS.length].id;
}

/**
 * Provider de leçons — couche d'abstraction.
 *
 * Aujourd'hui : source locale (leçons fictives dans lessons.js).
 * Demain : brancher une API IA sans toucher au reste de l'app.
 *
 * Toutes les pages passent UNIQUEMENT par ce provider (jamais par
 * lessons.js directement). Pour connecter une IA plus tard, il suffit
 * d'implémenter la même interface dans une classe `AiLessonProvider`
 * et de changer la ligne `export const lessons = ...` en bas.
 *
 * Interface :
 *   getCategories()                -> Category[]
 *   getAllLessons()                -> Promise<Lesson[]>
 *   getLesson(id)                  -> Promise<Lesson | null>
 *   getDailyLesson(dateStr)        -> Promise<Lesson>
 *   getByCategory(categoryId)      -> Promise<Lesson[]>
 */


class LocalLessonProvider {
  getCategories() {
    return CATEGORIES;
  }

  async getAllLessons() {
    return LESSONS;
  }

  async getLesson(id) {
    return LESSONS.find((l) => l.id === id) || null;
  }

  async getDailyLesson(dateStr) {
    const id = pickDailyLessonId(dateStr);
    return this.getLesson(id);
  }

  async getByCategory(categoryId) {
    return LESSONS.filter((l) => l.category === categoryId);
  }
}

/* ===== js/store.js ===== */
/**
 * Store — état de progression persistant (localStorage).
 *
 * Gère : streak quotidienne, leçons terminées, statut par leçon,
 * scores de quiz par catégorie, activité de la semaine.
 *
 * Toute la persistance passe par ici. Les pages lisent/écrivent via
 * les méthodes exposées, jamais directement dans localStorage.
 */


const KEY = "culture-g-daily:v1";

const defaultState = () => ({
  createdAt: todayStr(),
  streak: 0,
  bestStreak: 0,
  lastActiveDate: null,
  completedLessons: [], // ids
  // statut par leçon : { [id]: "progress" | "mastered" }
  lessonStatus: {},
  // scores par catégorie : { [catId]: { correct, total } }
  categoryScores: {},
  // dates d'activité (YYYY-MM-DD) pour la semaine
  activeDates: [],
});

function todayStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function daysBetween(a, b) {
  const da = new Date(a + "T00:00:00");
  const db = new Date(b + "T00:00:00");
  return Math.round((db - da) / 86400000);
}

class Store {
  constructor() {
    this.state = this._load();
    this._refreshStreak();
  }

  _load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaultState();
      return { ...defaultState(), ...JSON.parse(raw) };
    } catch (e) {
      console.warn("Store: lecture impossible, réinitialisation", e);
      return defaultState();
    }
  }

  _save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(this.state));
    } catch (e) {
      console.warn("Store: sauvegarde impossible", e);
    }
  }

  /** Remet la streak à zéro si un jour a été sauté. */
  _refreshStreak() {
    const last = this.state.lastActiveDate;
    if (!last) return;
    const gap = daysBetween(last, todayStr());
    if (gap > 1) {
      this.state.streak = 0;
      this._save();
    }
  }

  /** Marque une activité aujourd'hui et met à jour la streak. */
  markActiveToday() {
    const today = todayStr();
    if (this.state.lastActiveDate === today) return;

    const gap = this.state.lastActiveDate
      ? daysBetween(this.state.lastActiveDate, today)
      : null;

    if (gap === 1) this.state.streak += 1;
    else this.state.streak = 1;

    this.state.lastActiveDate = today;
    this.state.bestStreak = Math.max(this.state.bestStreak, this.state.streak);

    if (!this.state.activeDates.includes(today)) {
      this.state.activeDates.push(today);
    }
    this._save();
  }

  markLessonProgress(id) {
    if (this.state.lessonStatus[id] !== "mastered") {
      this.state.lessonStatus[id] = "progress";
    }
    this.markActiveToday();
    this._save();
  }

  /** Enregistre le résultat d'un quiz pour une leçon. */
  recordQuiz(lesson, correct, total) {
    const id = lesson.id;
    if (!this.state.completedLessons.includes(id)) {
      this.state.completedLessons.push(id);
    }
    // maîtrisé si au moins 2/3 de bonnes réponses
    this.state.lessonStatus[id] = correct / total >= 2 / 3 ? "mastered" : "progress";

    const cat = lesson.category;
    const prev = this.state.categoryScores[cat] || { correct: 0, total: 0 };
    this.state.categoryScores[cat] = {
      correct: prev.correct + correct,
      total: prev.total + total,
    };

    this.markActiveToday();
    this._save();
  }

  getStatus(id) {
    return this.state.lessonStatus[id] || "todo";
  }

  get completedCount() {
    return this.state.completedLessons.length;
  }

  /** Activité des 7 derniers jours (lun→dim) pour l'affichage hebdo. */
  getWeek() {
    const today = new Date();
    const dow = (today.getDay() + 6) % 7; // 0 = lundi
    const monday = new Date(today);
    monday.setDate(today.getDate() - dow);

    const labels = ["L", "M", "M", "J", "V", "S", "D"];
    const week = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const ds = todayStr(d);
      week.push({
        label: labels[i],
        date: ds,
        done: this.state.activeDates.includes(ds),
        today: ds === todayStr(),
      });
    }
    return week;
  }

  /** Force/faiblesse par thème + score global de culture G (0–100). */
  getThemeScores() {
    const rows = CATEGORIES.map((c) => {
      const s = this.state.categoryScores[c.id];
      const pct = s && s.total ? Math.round((s.correct / s.total) * 100) : null;
      return { id: c.id, label: c.label, icon: c.icon, pct, played: !!s };
    });
    return rows;
  }

  getGlobalScore() {
    const played = this.getThemeScores().filter((r) => r.played);
    if (!played.length) return 0;
    const avg = played.reduce((a, r) => a + r.pct, 0) / played.length;
    // pondéré par le nombre de leçons terminées (progression + maîtrise)
    const coverage = Math.min(1, this.completedCount / 8);
    return Math.round(avg * (0.6 + 0.4 * coverage));
  }

  strongestTheme() {
    const played = this.getThemeScores().filter((r) => r.played);
    if (!played.length) return null;
    return played.reduce((a, b) => (b.pct > a.pct ? b : a));
  }

  weakestTheme() {
    const played = this.getThemeScores().filter((r) => r.played);
    if (!played.length) return null;
    return played.reduce((a, b) => (b.pct < a.pct ? b : a));
  }

  reset() {
    this.state = defaultState();
    this._save();
  }
}

const store = new Store();


/* ===== js/router.js ===== */
/**
 * Router minimaliste basé sur le hash (#/route).
 * Gère les animations légères de transition entre les pages.
 */

const routes = {};
let notFound = null;
let currentPath = null;

function register(path, render) {
  routes[path] = render;
}

function setNotFound(render) {
  notFound = render;
}

/** Navigue vers une route (ex: navigate("lesson", { id: "..." })). */
function navigate(path, params = {}) {
  const query = new URLSearchParams(params).toString();
  location.hash = `#/${path}${query ? "?" + query : ""}`;
}

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "") || "home";
  const [path, queryStr] = raw.split("?");
  const params = Object.fromEntries(new URLSearchParams(queryStr || ""));
  return { path: path || "home", params };
}

async function resolve() {
  const { path, params } = parseHash();
  const render = routes[path] || notFound;
  if (!render) return;

  const view = document.getElementById("view");
  const isSamePath = path === currentPath;
  currentPath = path;

  // Rendu du contenu
  const content = await render(params);

  view.innerHTML = "";
  if (typeof content === "string") view.innerHTML = content;
  else if (content instanceof Node) view.appendChild(content);

  // Animation de transition (sauf reduced-motion géré en CSS)
  view.classList.remove("view-enter");
  // reflow pour rejouer l'animation
  void view.offsetWidth;
  view.classList.add("view-enter");

  if (!isSamePath) window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });

  // notifie la tab bar
  window.dispatchEvent(new CustomEvent("route:changed", { detail: { path, params } }));
}

function startRouter() {
  window.addEventListener("hashchange", resolve);
  resolve();
}

function getCurrentPath() {
  return currentPath;
}

  library: '<path d="M4 5v14"/><path d="M8 5v14"/><rect x="11" y="5" width="9" height="14" rx="1"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/>',
};

const TABS = [
  { path: "home", label: "Accueil", icon: "home" },
  { path: "library", label: "Bibliothèque", icon: "library" },
  { path: "profile", label: "Profil", icon: "profile" },
];

function svg(paths) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
}

function mountNav() {
  const nav = document.getElementById("tabbar");

  const paint = () => {
    const current = getCurrentPath() || "home";
    // les pages leçon/quiz restent rattachées à "accueil"
    const active = ["lesson", "quiz"].includes(current) ? "home" : current;

    nav.innerHTML = TABS.map(
      (t) => `
      <button class="tab ${t.path === active ? "active" : ""}" data-path="${t.path}">
        ${svg(ICONS[t.icon])}
        <span>${t.label}</span>
      </button>`
    ).join("");

    nav.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => navigate(btn.dataset.path));
    });
  };

  paint();
  window.addEventListener("route:changed", paint);
}

async function renderQuiz(params) {
  const lesson = await lessons.getLesson(params.id);
  if (!lesson) return `<div class="card">Quiz introuvable.</div>`;

  const el = document.createElement("div");
  el.className = "view-enter";

  // état local du quiz
  let index = 0;
  let correctCount = 0;
  let answered = false;

  const total = lesson.quiz.length;

  function renderQuestion() {
    const q = lesson.quiz[index];
    answered = false;

    el.innerHTML = `
      <button class="btn btn-ghost" id="quit">← Quitter</button>
      <div class="progress" style="margin-bottom:18px;"><span style="width:${((index) / total) * 100}%"></span></div>
      <span class="quiz-progress">Question ${index + 1} / ${total}</span>
      <h2 class="question">${q.question}</h2>
      <div class="options">
        ${q.options
          .map(
            (opt, i) => `
          <button class="option" data-i="${i}">
            <span class="marker">${String.fromCharCode(65 + i)}</span>
            <span>${opt}</span>
          </button>`
          )
          .join("")}
      </div>
      <div id="fb"></div>
    `;

    el.querySelector("#quit").addEventListener("click", () =>
      navigate("lesson", { id: lesson.id })
    );

    el.querySelectorAll(".option").forEach((btn) => {
      btn.addEventListener("click", () => onAnswer(parseInt(btn.dataset.i, 10)));
    });
  }

  function onAnswer(choice) {
    if (answered) return;
    answered = true;
    const q = lesson.quiz[index];
    const isRight = choice === q.answer;
    if (isRight) correctCount++;

    const opts = el.querySelectorAll(".option");
    opts.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add("correct");
      else if (i === choice) btn.classList.add("wrong");
    });

    const fb = el.querySelector("#fb");
    fb.innerHTML = `
      <div class="feedback ${isRight ? "ok" : "ko"}">
        <strong>${isRight ? "Bravo ! 🎉" : "Pas tout à fait."}</strong> ${q.explain}
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="next">${index + 1 < total ? "Question suivante" : "Voir mon score"}</button>
      </div>
    `;
    fb.querySelector("#next").addEventListener("click", () => {
      index++;
      if (index < total) renderQuestion();
      else finish();
    });
  }

  function finish() {
    store.recordQuiz(lesson, correctCount, total);
    const pct = Math.round((correctCount / total) * 100);
    const mastered = correctCount / total >= 2 / 3;

    el.innerHTML = `
      <div class="stagger center">
        <span class="eyebrow">Quiz terminé</span>
        <h1 class="lesson-title" style="margin-bottom:16px;">${lesson.title}</h1>

        <div class="score-ring" style="--pct:${pct}%">
          <div class="inner">
            <div>
              <div class="num">${correctCount}/${total}</div>
              <div class="muted" style="font-size:.8rem;">${pct}%</div>
            </div>
          </div>
        </div>

        <p style="font-size:1.05rem;margin-top:10px;">
          ${mastered ? "Sujet <strong>maîtrisé</strong> ✅" : "Presque ! Un petit tour de révision et c'est acquis."}
        </p>

        <div class="btn-row" style="max-width:340px;margin:22px auto 0;">
          <button class="btn btn-primary" id="continue">Continuer</button>
          <button class="btn btn-outline" id="review">Revoir la leçon</button>
        </div>
      </div>
    `;

    el.querySelector("#continue").addEventListener("click", () => navigate("home"));
    el.querySelector("#review").addEventListener("click", () =>
      navigate("lesson", { id: lesson.id })
    );
  }

  renderQuestion();
  return el;
}


/* ===== js/pages/library.js ===== */

const STATUS_LABEL = {
  todo: { cls: "todo", txt: "Non commencé" },
  progress: { cls: "progress", txt: "En cours" },
  mastered: { cls: "mastered", txt: "Maîtrisé" },
};

async function renderLibrary(params) {
  const all = await lessons.getAllLessons();
  const cats = lessons.getCategories();
  const active = params.cat || "all";

  const el = document.createElement("div");
  el.className = "stagger";

  const filtered = active === "all" ? all : all.filter((l) => l.category === active);

  const catById = Object.fromEntries(cats.map((c) => [c.id, c]));

  el.innerHTML = `
    <header class="page-head">
      <span class="eyebrow">Explorer</span>
      <h1>Bibliothèque</h1>
      <p>Choisissez un thème et progressez à votre rythme.</p>
    </header>

    <div class="filter-row">
      <button class="filter ${active === "all" ? "active" : ""}" data-cat="all">Tous</button>
      ${cats
        .map(
          (c) => `<button class="filter ${active === c.id ? "active" : ""}" data-cat="${c.id}">${c.icon} ${c.label}</button>`
        )
        .join("")}
    </div>

    <div class="topic-list">
      ${filtered
        .map((l) => {
          const st = STATUS_LABEL[store.getStatus(l.id)];
          const c = catById[l.category];
          return `
          <div class="topic" data-id="${l.id}">
            <div class="ic">${c.icon}</div>
            <div class="t-main">
              <div class="t-title">${l.title}</div>
              <div class="t-cat">${c.label} · ${l.minutes} min</div>
            </div>
            <span class="status ${st.cls}">${st.txt}</span>
          </div>`;
        })
        .join("")}
      ${filtered.length === 0 ? `<p class="muted center">Aucun sujet dans ce thème pour le moment.</p>` : ""}
    </div>
  `;

  el.querySelectorAll(".filter").forEach((btn) => {
    btn.addEventListener("click", () => navigate("library", { cat: btn.dataset.cat }));
  });
  el.querySelectorAll(".topic").forEach((t) => {
    t.addEventListener("click", () => navigate("lesson", { id: t.dataset.id }));
  });

  return el;
}


/* ===== js/pages/profile.js ===== */

function barColor(pct) {
  if (pct >= 70) return "var(--success)";
  if (pct >= 40) return "var(--gold)";
  return "var(--danger)";
}

async function renderProfile() {
  const themes = store.getThemeScores();
  const played = themes.filter((t) => t.played);
  const strong = store.strongestTheme();
  const weak = store.weakestTheme();
  const global = store.getGlobalScore();

  const el = document.createElement("div");
  el.className = "stagger";

  el.innerHTML = `
    <header class="page-head">
      <span class="eyebrow">Mon profil</span>
      <h1>Ma culture G</h1>
    </header>

    <section class="card profile-hero">
      <div class="avatar">CG</div>
      <div class="stat-value" style="font-size:2.4rem;color:var(--navy);">${global}<span style="font-size:1.1rem;color:var(--ink-faint);">/100</span></div>
      <div class="stat-label">Score global de culture générale</div>
      <div class="progress" style="max-width:260px;margin:14px auto 0;"><span style="width:${global}%"></span></div>
    </section>

    <div class="stat-grid">
      <div class="stat">
        <div class="stat-value"><span class="flame">🔥</span> ${store.state.streak}</div>
        <div class="stat-label">Streak actuelle</div>
      </div>
      <div class="stat">
        <div class="stat-value">${store.completedCount}</div>
        <div class="stat-label">Leçons terminées</div>
      </div>
      <div class="stat">
        <div class="stat-value">${store.state.bestStreak}</div>
        <div class="stat-label">Meilleure streak</div>
      </div>
      <div class="stat">
        <div class="stat-value">${played.length}/${themes.length}</div>
        <div class="stat-label">Thèmes explorés</div>
      </div>
    </div>

    ${
      strong || weak
        ? `<h3 class="section-title">Forces & faiblesses</h3>
      <section class="card">
        ${strong ? `<div class="list-item"><span>💪 Point fort</span><strong>${strong.icon} ${strong.label} · ${strong.pct}%</strong></div>` : ""}
        ${weak && (!strong || weak.id !== strong.id) ? `<div class="list-item"><span>🎯 À travailler</span><strong>${weak.icon} ${weak.label} · ${weak.pct}%</strong></div>` : ""}
      </section>`
        : ""
    }

    <h3 class="section-title">Maîtrise par thème</h3>
    <section class="card">
      <div class="themes">
        ${themes
          .map((t) => {
            const pct = t.pct ?? 0;
            return `
            <div class="theme-row">
              <span class="t-name">${t.icon} ${t.label}</span>
              <span class="bar"><span style="width:${pct}%;background:${barColor(pct)}"></span></span>
              <span class="pct">${t.played ? pct + "%" : "—"}</span>
            </div>`;
          })
          .join("")}
      </div>
      ${played.length === 0 ? `<p class="muted center" style="margin-top:14px;">Terminez des quiz pour révéler vos statistiques.</p>` : ""}
    </section>

    <div class="btn-row" style="margin-top:24px;">
      <button class="btn btn-primary" id="go">Faire ma leçon du jour</button>
      <button class="btn btn-ghost" id="reset">Réinitialiser ma progression</button>
    </div>
  `;

  el.querySelector("#go").addEventListener("click", () => navigate("home"));
  el.querySelector("#reset").addEventListener("click", () => {
    if (confirm("Réinitialiser toute votre progression ? Cette action est irréversible.")) {
      store.reset();
      navigate("home");
      location.reload();
    }
  });

  return el;
}


/* ===== js/app.js ===== */
/**
 * Culture G Daily — point d'entrée.
 * Enregistre les routes, monte la navigation et démarre le router.
 */



register("home", renderHome);
register("lesson", renderLesson);
register("quiz", renderQuiz);
register("library", renderLibrary);
register("profile", renderProfile);

setNotFound(renderHome);

mountNav();
startRouter();

})();
</script>
