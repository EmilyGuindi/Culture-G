<style>
/* =========================================================
   Culture G Daily — Design System
   Ambiance : éducative moderne, premium, minimaliste, éditoriale
   ========================================================= */

:root {
  /* Palette */
  --cream: #F7F2E9;
  --cream-soft: #FBF8F1;
  --card: #FFFFFF;
  --ink: #23262B;          /* anthracite */
  --ink-soft: #4A4E56;
  --ink-faint: #8A8F98;
  --line: #EAE3D6;
  --navy: #223A5E;         /* bleu nuit */
  --navy-deep: #1B2E4A;
  --gold: #C6A15B;         /* doré */
  --gold-soft: #E9DCC0;
  --success: #3E8E6E;
  --danger: #C25B54;

  /* Typo */
  --font-editorial: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  /* Espacement & rayons */
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow-soft: 0 10px 30px -18px rgba(34, 58, 94, 0.35);
  --shadow-card: 0 18px 40px -26px rgba(27, 46, 74, 0.45);

  --maxw: 520px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.55;
}

/* ---------- Shell & layout ---------- */

.app-shell {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background:
    radial-gradient(120% 60% at 50% -10%, #FBF7EE 0%, var(--cream) 60%);
}

.view {
  width: 100%;
  max-width: var(--maxw);
  padding: 22px 20px calc(96px + env(safe-area-inset-bottom));
  flex: 1;
}

/* ---------- Typographie ---------- */

h1, h2, h3 { font-family: var(--font-editorial); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.eyebrow {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-weight: 600;
  color: var(--gold);
}
.muted { color: var(--ink-faint); }

/* ---------- Header commun ---------- */

.page-head { margin-bottom: 22px; }
.page-head h1 { font-size: 1.9rem; line-height: 1.15; margin-top: 6px; }
.page-head p { color: var(--ink-soft); margin: 6px 0 0; }

/* ---------- Cartes ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-soft);
}

/* Carte "Leçon du jour" — mise en avant */
.hero-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(155deg, var(--navy) 0%, var(--navy-deep) 100%);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-card);
}
.hero-card::after {
  content: "";
  position: absolute;
  width: 220px; height: 220px;
  right: -70px; top: -90px;
  background: radial-gradient(circle, rgba(198,161,91,0.35), transparent 70%);
}
.hero-card .eyebrow { color: var(--gold-soft); }
.hero-card h2 { font-size: 1.5rem; margin: 10px 0 6px; color: #fff; }
.hero-card .hero-cat { font-size: 0.85rem; color: rgba(255,255,255,0.72); }
.hero-card .hero-preview { margin: 14px 0 0; color: rgba(255,255,255,0.82); font-size: 0.95rem; }

/* ---------- Boutons ---------- */

.btn {
  appearance: none;
  border: none;
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 1rem;
  border-radius: 999px;
  padding: 14px 22px;
  width: 100%;
  transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.btn:active { transform: translateY(1px) scale(0.995); }
.btn-primary { background: var(--gold); color: #2a2410; box-shadow: 0 10px 22px -12px rgba(198,161,91,0.9); }
.btn-primary:hover { background: #d0ac66; }
.btn-navy { background: #fff; color: var(--navy); }
.btn-navy:hover { background: #f4efe4; }
.btn-outline { background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
.btn-outline:hover { background: var(--cream-soft); }
.btn-ghost { background: transparent; color: var(--ink-soft); width: auto; padding: 10px 6px; }
.btn-row { display: grid; gap: 10px; margin-top: 16px; }
.btn.small { width: auto; padding: 10px 18px; font-size: 0.9rem; }

/* ---------- Stats / streak / progression ---------- */

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-soft);
}
.stat .stat-value { font-family: var(--font-editorial); font-size: 1.7rem; font-weight: 600; color: var(--navy); }
.stat .stat-label { font-size: 0.78rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }
.stat .flame { color: var(--gold); }

/* Progression hebdo */
.week { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.day {
  flex: 1;
  text-align: center;
  font-size: 0.72rem;
  color: var(--ink-faint);
}
.day .dot {
  width: 30px; height: 30px;
  margin: 0 auto 6px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600;
  color: var(--ink-faint);
  background: var(--cream-soft);
}
.day.done .dot { background: var(--navy); color: #fff; border-color: var(--navy); }
.day.today .dot { border-color: var(--gold); color: var(--navy); box-shadow: 0 0 0 3px rgba(198,161,91,0.18); }

/* Barre de progression */
.progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--navy), var(--gold)); border-radius: 999px; transition: width 0.4s ease; }

/* ---------- Section leçon (lecture) ---------- */

.lesson-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.chip {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--gold-soft);
  color: #6b5320;
}
.lesson-title { font-size: 1.7rem; line-height: 1.2; margin: 6px 0 4px; }
.lesson-body { margin-top: 18px; font-size: 1.02rem; color: var(--ink-soft); }
.lesson-body p { margin: 0 0 14px; }
.lesson-body p:first-letter { }

.callout {
  border-radius: var(--radius-md);
  padding: 16px 18px;
  margin: 18px 0;
  border: 1px solid var(--line);
}
.callout .callout-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.callout p { margin: 0; }
.callout.retenir { background: #F3F6FA; border-color: #DCE6F1; }
.callout.retenir .callout-title { color: var(--navy); }
.callout.stylé { background: #FBF4E4; border-color: var(--gold-soft); }
.callout.stylé .callout-title { color: #8a6a24; }

/* ---------- Quiz ---------- */

.quiz-progress { font-size: 0.8rem; color: var(--ink-faint); letter-spacing: 0.06em; text-transform: uppercase; }
.question { font-family: var(--font-editorial); font-size: 1.35rem; line-height: 1.3; margin: 12px 0 20px; }
.options { display: grid; gap: 12px; }
.option {
  text-align: left;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 15px 16px;
  font-size: 1rem;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  display: flex; align-items: center; gap: 12px;
}
.option .marker {
  width: 26px; height: 26px; flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; color: var(--ink-faint);
}
.option:not(:disabled):hover { border-color: var(--navy); }
.option.correct { border-color: var(--success); background: #EEF7F2; }
.option.correct .marker { background: var(--success); color: #fff; border-color: var(--success); }
.option.wrong { border-color: var(--danger); background: #FBEEED; }
.option.wrong .marker { background: var(--danger); color: #fff; border-color: var(--danger); }
.option:disabled { cursor: default; }

.feedback {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  animation: rise 0.3s ease;
}
.feedback.ok { background: #EEF7F2; color: #2c6a52; border: 1px solid #cfe8dc; }
.feedback.ko { background: #FBEEED; color: #9c4a44; border: 1px solid #f0d6d3; }

/* Écran score */
.score-ring {
  width: 150px; height: 150px; margin: 8px auto 4px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--gold) var(--pct, 0%), var(--line) 0);
}
.score-ring .inner {
  width: 120px; height: 120px; border-radius: 50%;
  background: var(--cream);
  display: grid; place-items: center; text-align: center;
}
.score-ring .num { font-family: var(--font-editorial); font-size: 2rem; font-weight: 600; color: var(--navy); }

/* ---------- Bibliothèque ---------- */

.filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; margin: 0 -4px 6px; -webkit-overflow-scrolling: touch; }
.filter-row::-webkit-scrollbar { display: none; }
.filter {
  flex: none;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 0.85rem; font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.filter.active { background: var(--navy); color: #fff; border-color: var(--navy); }

.topic-list { display: grid; gap: 12px; }
.topic {
  display: flex; align-items: center; gap: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: transform 0.12s ease, box-shadow 0.2s ease;
}
.topic:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
.topic .ic { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 1.2rem; background: var(--cream-soft); border: 1px solid var(--line); }
.topic .t-main { flex: 1; min-width: 0; }
.topic .t-title { font-weight: 600; font-family: var(--font-editorial); font-size: 1.05rem; }
.topic .t-cat { font-size: 0.78rem; color: var(--ink-faint); }
.status {
  font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
}
.status.todo { background: var(--cream-soft); color: var(--ink-faint); border: 1px solid var(--line); }
.status.progress { background: #FBF4E4; color: #8a6a24; }
.status.mastered { background: #EEF7F2; color: #2c6a52; }

/* ---------- Profil ---------- */

.profile-hero { text-align: center; padding: 26px 20px; }
.avatar {
  width: 76px; height: 76px; margin: 0 auto 12px;
  border-radius: 50%;
  background: linear-gradient(155deg, var(--navy), var(--navy-deep));
  color: var(--gold);
  display: grid; place-items: center;
  font-family: var(--font-editorial); font-size: 1.8rem; font-weight: 700;
}
.themes { display: grid; gap: 10px; margin-top: 12px; }
.theme-row { display: flex; align-items: center; gap: 12px; }
.theme-row .t-name { width: 108px; flex: none; font-size: 0.9rem; }
.theme-row .bar { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.theme-row .bar > span { display: block; height: 100%; border-radius: 999px; }
.theme-row .pct { width: 42px; text-align: right; font-size: 0.82rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: none; }

/* ---------- Tab bar ---------- */

.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  justify-content: space-around;
  background: rgba(251,248,241,0.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
}
.tab {
  flex: 1;
  max-width: 100px;
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-faint);
  font-size: 0.68rem; font-weight: 600;
  padding: 6px 0;
}
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--navy); }
.tab.active svg { stroke: var(--navy); }

/* ---------- Section title ---------- */
.section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); margin: 26px 0 12px; }

/* ---------- Utilitaires ---------- */
.stack > * + * { margin-top: 14px; }
.center { text-align: center; }
.hidden { display: none !important; }

/* ---------- Animations de transition de page ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.view-enter { animation: rise 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
.stagger > * { animation: rise 0.4s both cubic-bezier(0.22, 1, 0.36, 1); }
.stagger > *:nth-child(1) { animation-delay: 0.02s; }
.stagger > *:nth-child(2) { animation-delay: 0.08s; }
.stagger > *:nth-child(3) { animation-delay: 0.14s; }
.stagger > *:nth-child(4) { animation-delay: 0.20s; }
.stagger > *:nth-child(5) { animation-delay: 0.26s; }
.stagger > *:nth-child(6) { animation-delay: 0.32s; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- Desktop ---------- */
@media (min-width: 720px) {
  :root { --maxw: 620px; }
  .app-shell { background: radial-gradient(120% 50% at 50% -20%, #FBF7EE 0%, var(--cream) 55%); }
  .view { padding-top: 40px; }
  .page-head h1 { font-size: 2.2rem; }
}

/* =========================================================
   GAMIFICATION — niveaux, XP, badges, objectif, confettis
   ========================================================= */

/* Carte de niveau (accueil) */
.level-card {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-lg);
  padding: 20px;
  color: #fff;
  background: linear-gradient(135deg, #24406b 0%, #1b2e4a 55%, #2a2350 100%);
  box-shadow: var(--shadow-card);
}
.level-card::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(60% 80% at 85% -10%, rgba(198,161,91,0.45), transparent 60%),
    radial-gradient(50% 70% at 0% 120%, rgba(120,160,255,0.25), transparent 60%);
  pointer-events: none;
}
.level-card .lvl-top { display: flex; align-items: center; gap: 12px; position: relative; }
.level-badge {
  width: 52px; height: 52px; flex: none;
  border-radius: 15px;
  display: grid; place-items: center;
  font-family: var(--font-editorial); font-weight: 700; font-size: 1.3rem;
  color: #2a2410;
  background: linear-gradient(150deg, #f0d79a, var(--gold));
  box-shadow: 0 6px 16px -6px rgba(198,161,91,0.9), inset 0 1px 0 rgba(255,255,255,0.5);
}
.level-card .lvl-meta { flex: 1; min-width: 0; }
.level-card .lvl-title { font-family: var(--font-editorial); font-weight: 600; font-size: 1.2rem; line-height: 1.1; }
.level-card .lvl-sub { font-size: 0.8rem; color: rgba(255,255,255,0.7); }
.level-card .lvl-xp { text-align: right; font-variant-numeric: tabular-nums; }
.level-card .lvl-xp b { font-family: var(--font-editorial); font-size: 1.15rem; }

/* Barre d'XP avec brillance */
.xpbar { position: relative; height: 10px; border-radius: 999px; background: rgba(255,255,255,0.16); overflow: hidden; margin-top: 14px; }
.xpbar > span {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #e9dcc0, var(--gold));
  box-shadow: 0 0 12px rgba(198,161,91,0.7);
  transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
  position: relative; overflow: hidden;
}
.xpbar > span::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
  transform: translateX(-100%); animation: shimmer 2.4s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }
.level-card .lvl-next { margin-top: 8px; font-size: 0.76rem; color: rgba(255,255,255,0.72); display: flex; justify-content: space-between; }

/* Objectif du jour + streak (ligne d'anneaux) */
.rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ring-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md);
  padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-soft);
}
.mini-ring {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.3rem;
  background: conic-gradient(var(--gold) var(--p,0%), var(--line) 0);
}
.mini-ring .hole { width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
.ring-card .rc-val { font-family: var(--font-editorial); font-weight: 600; font-size: 1.2rem; color: var(--navy); line-height: 1; }
.ring-card .rc-lbl { font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
.flame-anim { display: inline-block; animation: flicker 1.6s ease-in-out infinite; }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.12) rotate(2deg); } }

/* Badges */
.badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.badge {
  text-align: center; padding: 12px 6px; border-radius: var(--radius-md);
  background: var(--cream-soft); border: 1px solid var(--line);
}
.badge .b-ic {
  width: 46px; height: 46px; margin: 0 auto 6px; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.4rem;
  background: #fff; border: 1px solid var(--line);
}
.badge.earned { background: linear-gradient(160deg, #fbf4e4, #fff); border-color: var(--gold-soft); }
.badge.earned .b-ic { background: linear-gradient(150deg, #f3e6c6, var(--gold-soft)); box-shadow: 0 6px 14px -8px rgba(198,161,91,0.9); }
.badge.locked { opacity: 0.5; filter: grayscale(1); }
.badge .b-name { font-size: 0.66rem; font-weight: 600; line-height: 1.2; color: var(--ink-soft); }

/* Écran de résultats gamifié */
.reward { text-align: center; }
.xp-pop {
  display: inline-block; margin: 10px auto; padding: 8px 20px; border-radius: 999px;
  font-family: var(--font-editorial); font-weight: 700; font-size: 1.3rem; color: #6b5320;
  background: linear-gradient(150deg, #f3e6c6, var(--gold-soft));
  box-shadow: 0 8px 20px -10px rgba(198,161,91,0.9);
  animation: pop 0.5s cubic-bezier(0.22,1,0.36,1);
}
@keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

.levelup {
  margin: 16px 0; padding: 16px; border-radius: var(--radius-md);
  color: #fff; background: linear-gradient(135deg, var(--navy), #2a2350);
  box-shadow: var(--shadow-card); animation: rise 0.5s both;
}
.levelup .lu-eyebrow { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-soft); }
.levelup .lu-title { font-family: var(--font-editorial); font-size: 1.35rem; margin-top: 4px; }

.badge-unlocked { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 12px auto; padding: 12px 16px; max-width: 320px; border-radius: var(--radius-md); background: var(--cream-soft); border: 1px solid var(--gold-soft); animation: rise 0.5s both; }
.badge-unlocked .bu-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; background: linear-gradient(150deg, #f3e6c6, var(--gold-soft)); }
.badge-unlocked .bu-txt { text-align: left; }
.badge-unlocked .bu-title { font-weight: 700; font-size: 0.9rem; }
.badge-unlocked .bu-desc { font-size: 0.76rem; color: var(--ink-faint); }

/* Confettis */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* Récompense XP annoncée sur le hero */
.reward-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 600; color: var(--gold-soft); background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 999px; margin-top: 12px; }

/* Progress général vers la maîtrise (profil) */
.big-progress { display: flex; align-items: baseline; gap: 8px; justify-content: center; }
.big-progress .bp-num { font-family: var(--font-editorial); font-size: 2.6rem; font-weight: 700; color: var(--gold); }

</style>

    body: [

      "Avant la monnaie, on pratiquait le troc, échanger directement un bien contre un autre. Mais le troc a un défaut majeur : il faut que chacun désire précisément ce que l'autre propose, au même moment. La monnaie résout ce problème en servant d'intermédiaire universel. Elle remplit trois fonctions : unité de compte (mesurer la valeur), moyen d'échange (payer) et réserve de valeur (épargner pour plus tard).",
      "Longtemps, la monnaie a tiré sa valeur de sa matière : des pièces d'or ou d'argent valaient pour le métal qu'elles contenaient. Puis vint la monnaie « fiduciaire », du latin fiducia, la confiance : un billet ne vaut plus par lui-même, mais parce que chacun est sûr que les autres l'accepteront. Sa valeur repose sur une croyance partagée et sur la solidité de l'État et de la banque centrale qui la garantissent.",

      "En 1874, à Paris, un groupe de peintres refusés par les salons officiels décide d'exposer par lui-même. Parmi les toiles, une marine de Claude Monet, aux contours flous, intitulée « Impression, soleil levant ». Un critique, moqueur, s'empare du mot « impression » pour railler ces œuvres qu'il juge inachevées. Sans le vouloir, il baptise l'un des mouvements les plus célèbres de l'histoire de l'art.",
      "Que reprochait-on à ces peintres ? De ne pas « finir » leurs tableaux. Là où la peinture académique exigeait des contours nets, des sujets nobles et une facture lisse, les impressionnistes peignaient par touches rapides et visibles, laissant deviner le geste. De près, on ne voit que des taches de couleur ; c'est à distance que l'image se recompose dans l'œil du spectateur.",
      "Leur véritable sujet n'était pas tant les choses que la lumière et l'instant. Ils voulaient saisir une sensation fugitive : le reflet du soleil sur l'eau, la brume d'un matin, l'agitation d'un boulevard. Pour cela, ils quittaient l'atelier et peignaient en plein air, sur le motif, cherchant à capter une atmosphère avant qu'elle ne change.",

      "Le contexte comptait aussi. La photographie, en train de naître, libérait la peinture de sa mission de reproduction fidèle : puisqu'un appareil pouvait fixer le réel, l'artiste pouvait explorer autre chose — la perception, l'émotion, la subjectivité du regard. L'impressionnisme ouvre ainsi la voie à tout l'art moderne.",
      "Longtemps moqués, ces peintres — Monet, Renoir, Degas, Pissarro, Morisot — comptent aujourd'hui parmi les plus adorés du public. Leur audace était de peindre non ce que l'on sait du monde, mais ce que l'œil perçoit réellement, dans l'éclat changeant d'un instant. Une révolution douce, qui a changé notre façon de voir.",

      "Nous utilisons Internet des dizaines de fois par jour sans y penser. Pourtant, derrière un message envoyé ou une vidéo regardée se cache une infrastructure planétaire d'une ingéniosité remarquable. Internet n'est pas un « nuage » abstrait : c'est un réseau physique de câbles, d'antennes et de machines, régi par des règles communes.",
      "Le mot le dit : Internet est un « inter-réseau », un réseau de réseaux. Aucune entreprise ni aucun État ne le possède en entier. C'est un ensemble de réseaux indépendants qui acceptent de communiquer entre eux selon un langage commun, des « protocoles ». Cette architecture décentralisée le rend robuste : si une partie tombe, l'information trouve un autre chemin.",
      "L'idée fondatrice est la « commutation par paquets ». Plutôt que d'envoyer un fichier d'un bloc, on le découpe en petits morceaux, les paquets. Chacun voyage indépendamment, empruntant potentiellement des routes différentes, avant d'être réassemblé à l'arrivée. Ce système utilise mieux le réseau et résiste aux pannes, puisqu'un paquet perdu peut être renvoyé sans tout recommencer.",
      "Pour que ces paquets arrivent à bon port, chaque machine possède une adresse, l'adresse IP, sorte de numéro de téléphone du réseau. Comme ces suites de chiffres sont difficiles à retenir, un système, le DNS, traduit les noms lisibles — comme un nom de site — en adresses IP. C'est l'annuaire d'Internet.",

/** Renvoie la leçon du jour de façon déterministe (change chaque jour). */
function pickDailyLessonId(dateStr) {
  // dateStr au format YYYY-MM-DD → index stable dans la journée
  const seed = dateStr.split("-").reduce((acc, n) => acc + parseInt(n, 10), 0);
  return LESSONS[seed % LESSONS.length].id;
}

class LocalLessonProvider {
  getCategories() {

  async getAllLessons() {

  async getLesson(id) {
    return LESSONS.find((l) => l.id === id) || null;

  async getDailyLesson(dateStr) {
    const id = pickDailyLessonId(dateStr);
    return this.getLesson(id);
  }

  async getByCategory(categoryId) {
    return LESSONS.filter((l) => l.category === categoryId);
  }
}

/**
 * Store — état de progression persistant (localStorage) + gamification.
 *
 * Gère : streak, leçons terminées, statuts, scores par thème,
 * XP, niveaux, badges/succès, objectif quotidien.
 *
 * Toute la persistance passe par ici. Les pages lisent/écrivent via
 * les méthodes exposées, jamais directement dans localStorage.
 */


const KEY = "culture-g-daily:v1";

/** Paliers de niveaux (titres = progression de culture générale). */
const LEVELS = [
  { min: 0, title: "Novice curieux" },
  { min: 120, title: "Apprenti" },
  { min: 300, title: "Amateur éclairé" },
  { min: 550, title: "Esprit cultivé" },
  { min: 900, title: "Érudit" },
  { min: 1400, title: "Fin connaisseur" },
  { min: 2000, title: "Encyclopédiste" },
  { min: 2800, title: "Maître de Culture G" },
  { min: 4000, title: "Légende de la Culture G" },
];

/** Récompenses XP. */
const XP = {
  read: 10, // lire une leçon (une fois)
  correct: 10, // par bonne réponse
  mastered: 20, // bonus leçon maîtrisée (≥ 2/3)
  perfect: 15, // bonus quiz parfait (3/3)
};

/** Badges / succès. `test(store)` renvoie true quand débloqué. */
const BADGES = [
  { id: "premiere-lecon", icon: "🎓", title: "Premiers pas", desc: "Terminer 1 leçon", test: (s) => s.completedCount >= 1 },
  { id: "assidu", icon: "📚", title: "Assidu", desc: "Terminer 10 leçons", test: (s) => s.completedCount >= 10 },
  { id: "boulimique", icon: "🍽️", title: "Boulimique de savoir", desc: "Terminer 25 leçons", test: (s) => s.completedCount >= 25 },
  { id: "encyclopedie", icon: "🏛️", title: "Encyclopédie vivante", desc: "Terminer 50 leçons", test: (s) => s.completedCount >= 50 },
  { id: "sans-faute", icon: "✨", title: "Sans faute", desc: "Un quiz parfait (3/3)", test: (s) => s.state.perfectQuizzes >= 1 },
  { id: "serie-parfaite", icon: "💯", title: "Cinq sans faute", desc: "5 quiz parfaits", test: (s) => s.state.perfectQuizzes >= 5 },
  { id: "streak-3", icon: "⚡", title: "En rythme", desc: "3 jours d'affilée", test: (s) => s.state.bestStreak >= 3 },
  { id: "streak-7", icon: "📆", title: "Semaine parfaite", desc: "7 jours d'affilée", test: (s) => s.state.bestStreak >= 7 },
  { id: "streak-30", icon: "🗓️", title: "Increvable", desc: "30 jours d'affilée", test: (s) => s.state.bestStreak >= 30 },
  { id: "explorateur", icon: "🧭", title: "Explorateur", desc: "Un thème entamé dans chaque catégorie", test: (s) => s.state.categoriesPlayed.length >= CATEGORIES.length },
  { id: "specialiste", icon: "🎯", title: "Spécialiste", desc: "Maîtriser 3 leçons d'un même thème", test: (s) => Object.values(s.state.masteredByCat).some((n) => n >= 3) },
  { id: "erudit", icon: "⭐", title: "Érudit", desc: "Atteindre le niveau Érudit", test: (s) => s.levelInfo().index >= 4 },
];

const defaultState = () => ({
  createdAt: todayStr(),
  streak: 0,
  bestStreak: 0,
  lastActiveDate: null,
  completedLessons: [],
  lessonStatus: {}, // { [id]: "progress" | "mastered" }
  categoryScores: {}, // { [catId]: { correct, total } }
  activeDates: [],
  // gamification
  xp: 0,
  badges: [], // ids débloqués
  read: [], // ids de leçons lues (XP lecture)
  perfectQuizzes: 0,
  categoriesPlayed: [], // catégories avec ≥ 1 leçon terminée
  masteredByCat: {}, // { catId: nb de leçons maîtrisées }
});

function todayStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function daysBetween(a, b) {
  return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
}

class Store {
  constructor() {
    this.state = this._load();
    this._refreshStreak();
  }

  _load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaultState();
      return { ...defaultState(), ...JSON.parse(raw) };
    } catch (e) {
      console.warn("Store: lecture impossible, réinitialisation", e);
      return defaultState();
    }
  }

  _save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(this.state));
    } catch (e) {
      console.warn("Store: sauvegarde impossible", e);
    }
  }

  _refreshStreak() {
    const last = this.state.lastActiveDate;
    if (last && daysBetween(last, todayStr()) > 1) {
      this.state.streak = 0;
      this._save();
    }
  }

  markActiveToday() {
    const today = todayStr();
    if (this.state.lastActiveDate === today) return;
    const gap = this.state.lastActiveDate ? daysBetween(this.state.lastActiveDate, today) : null;
    this.state.streak = gap === 1 ? this.state.streak + 1 : 1;
    this.state.lastActiveDate = today;
    this.state.bestStreak = Math.max(this.state.bestStreak, this.state.streak);
    if (!this.state.activeDates.includes(today)) this.state.activeDates.push(today);
    this._save();
  }

  /** Lecture d'une leçon → petit XP la première fois. */
  markLessonProgress(id) {
    if (this.state.lessonStatus[id] !== "mastered") this.state.lessonStatus[id] = "progress";
    if (!this.state.read.includes(id)) {
      this.state.read.push(id);
      this.state.xp += XP.read;
    }
    this.markActiveToday();
    this._checkBadges();
    this._save();
  }

  /**
   * Enregistre un quiz et attribue l'XP.
   * @returns {{xpEarned,leveledUp,fromTitle,toTitle,newBadges}}
   */
  recordQuiz(lesson, correct, total) {
    const id = lesson.id;
    const before = this.levelInfo().index;

    if (!this.state.completedLessons.includes(id)) this.state.completedLessons.push(id);

    const wasMastered = this.state.lessonStatus[id] === "mastered";
    const mastered = correct / total >= 2 / 3;
    this.state.lessonStatus[id] = mastered ? "mastered" : "progress";

    // scores par catégorie
    const cat = lesson.category;
    const prev = this.state.categoryScores[cat] || { correct: 0, total: 0 };
    this.state.categoryScores[cat] = { correct: prev.correct + correct, total: prev.total + total };
    if (!this.state.categoriesPlayed.includes(cat)) this.state.categoriesPlayed.push(cat);
    if (mastered && !wasMastered) {
      this.state.masteredByCat[cat] = (this.state.masteredByCat[cat] || 0) + 1;
    }

    // XP
    let xpEarned = correct * XP.correct;
    if (mastered) xpEarned += XP.mastered;
    if (correct === total) {
      xpEarned += XP.perfect;
      this.state.perfectQuizzes += 1;
    }
    this.state.xp += xpEarned;

    this.markActiveToday();
    const newBadges = this._checkBadges();
    this._save();

    const after = this.levelInfo().index;
    return {
      xpEarned,
      leveledUp: after > before,
      fromTitle: LEVELS[before].title,
      toTitle: LEVELS[after].title,
      newBadges,
    };
  }

  /** Débloque les badges nouvellement obtenus, renvoie la liste des nouveaux. */
  _checkBadges() {
    const newly = [];
    for (const b of BADGES) {
      if (!this.state.badges.includes(b.id) && b.test(this)) {
        this.state.badges.push(b.id);
        newly.push(b);
      }
    }
    return newly;
  }

  // ---- Niveaux ----
  levelInfo() {
    const xp = this.state.xp;
    let index = 0;
    for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].min) index = i;
    const cur = LEVELS[index];
    const next = LEVELS[index + 1];
    const isMax = !next;
    const span = isMax ? 1 : next.min - cur.min;
    const into = xp - cur.min;
    return {
      index,
      title: cur.title,
      xp,
      curMin: cur.min,
      nextMin: isMax ? xp : next.min,
      into,
      span,
      pct: isMax ? 100 : Math.round((into / span) * 100),
      isMax,
      toNext: isMax ? 0 : next.min - xp,
    };
  }

  // ---- Getters ----
  getStatus(id) {
    return this.state.lessonStatus[id] || "todo";
  }
  get completedCount() {
    return this.state.completedLessons.length;
  }
  get xp() {
    return this.state.xp;
  }

  getBadges() {
    return BADGES.map((b) => ({ ...b, earned: this.state.badges.includes(b.id) }));
  }
  get earnedBadgeCount() {
    return this.state.badges.length;
  }

  /** Objectif du jour : au moins une leçon/quiz aujourd'hui. */
  dailyGoalDone() {
    return this.state.activeDates.includes(todayStr());
  }

  getWeek() {
    const today = new Date();
    const dow = (today.getDay() + 6) % 7;
    const monday = new Date(today);
    monday.setDate(today.getDate() - dow);
    const labels = ["L", "M", "M", "J", "V", "S", "D"];
    const week = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const ds = todayStr(d);
      week.push({ label: labels[i], date: ds, done: this.state.activeDates.includes(ds), today: ds === todayStr() });
    }
    return week;
  }

  getThemeScores() {
    return CATEGORIES.map((c) => {
      const s = this.state.categoryScores[c.id];
      const pct = s && s.total ? Math.round((s.correct / s.total) * 100) : null;
      return { id: c.id, label: c.label, icon: c.icon, pct, played: !!s };
    });
  }

  getGlobalScore() {
    const played = this.getThemeScores().filter((r) => r.played);
    if (!played.length) return 0;
    const avg = played.reduce((a, r) => a + r.pct, 0) / played.length;
    const coverage = Math.min(1, this.completedCount / 12);
    return Math.round(avg * (0.6 + 0.4 * coverage));
  }

  strongestTheme() {
    const p = this.getThemeScores().filter((r) => r.played);
    return p.length ? p.reduce((a, b) => (b.pct > a.pct ? b : a)) : null;
  }
  weakestTheme() {
    const p = this.getThemeScores().filter((r) => r.played);
    return p.length ? p.reduce((a, b) => (b.pct < a.pct ? b : a)) : null;
  }

  reset() {
    this.state = defaultState();
    this._save();
  }
}

/* ===== js/router.js ===== */
/**
 * Router minimaliste basé sur le hash (#/route).
 * Gère les animations légères de transition entre les pages.
 */

const routes = {};
let notFound = null;
let currentPath = null;

function register(path, render) {
  routes[path] = render;
}

function setNotFound(render) {
  notFound = render;
}

/** Navigue vers une route (ex: navigate("lesson", { id: "..." })). */
function navigate(path, params = {}) {
  const query = new URLSearchParams(params).toString();
  location.hash = `#/${path}${query ? "?" + query : ""}`;
}

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "") || "home";
  const [path, queryStr] = raw.split("?");
  const params = Object.fromEntries(new URLSearchParams(queryStr || ""));
  return { path: path || "home", params };
}

async function resolve() {
  const { path, params } = parseHash();
  const render = routes[path] || notFound;
  if (!render) return;

  const view = document.getElementById("view");
  const isSamePath = path === currentPath;
  currentPath = path;

  // Rendu du contenu
  const content = await render(params);

  view.innerHTML = "";
  if (typeof content === "string") view.innerHTML = content;
  else if (content instanceof Node) view.appendChild(content);

  // Animation de transition (sauf reduced-motion géré en CSS)
  view.classList.remove("view-enter");
  // reflow pour rejouer l'animation
  void view.offsetWidth;
  view.classList.add("view-enter");

  if (!isSamePath) window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });

  // notifie la tab bar
  window.dispatchEvent(new CustomEvent("route:changed", { detail: { path, params } }));
}

function startRouter() {
  window.addEventListener("hashchange", resolve);
  resolve();
}

function getCurrentPath() {
  return currentPath;
}

/**
 * Confettis légers en Canvas — célébration à la fin d'un quiz réussi.
 * Respecte prefers-reduced-motion.
 */

const COLORS = ["#C6A15B", "#223A5E", "#E9DCC0", "#3E8E6E", "#d0ac66", "#2a4a78"];

function burstConfetti({ intense = false } = {}) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const canvas = document.createElement("canvas");
  canvas.id = "confetti";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  const W = window.innerWidth;
  const count = intense ? 160 : 90;
  const parts = Array.from({ length: count }, () => ({
    x: W / 2 + (Math.random() - 0.5) * 120,
    y: window.innerHeight * 0.28 + (Math.random() - 0.5) * 40,
    vx: (Math.random() - 0.5) * 9,
    vy: Math.random() * -9 - 4,
    size: Math.random() * 7 + 4,
    rot: Math.random() * Math.PI,
    vrot: (Math.random() - 0.5) * 0.3,
    color: COLORS[(Math.random() * COLORS.length) | 0],
    shape: Math.random() > 0.5 ? "rect" : "circle",
  }));

  const gravity = 0.24;
  const start = performance.now();
  const duration = 2600;

  function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts.forEach((p) => {
      p.vy += gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - t / duration);
      ctx.fillStyle = p.color;
      if (p.shape === "rect") ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
    if (t < duration) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

/* ===== js/pages/quiz.js ===== */

async function renderQuiz(params) {
  const lesson = await lessons.getLesson(params.id);
  if (!lesson) return `<div class="card">Quiz introuvable.</div>`;

  const el = document.createElement("div");
  el.className = "view-enter";

  let index = 0;
  let correctCount = 0;
  let answered = false;
  const total = lesson.quiz.length;

  function renderQuestion() {
    const q = lesson.quiz[index];
    answered = false;
    el.innerHTML = `
      <button class="btn btn-ghost" id="quit">← Quitter</button>
      <div class="progress" style="margin-bottom:18px;"><span style="width:${(index / total) * 100}%"></span></div>
      <span class="quiz-progress">Question ${index + 1} / ${total}</span>
      <h2 class="question">${q.question}</h2>
      <div class="options">
        ${q.options
          .map(
            (opt, i) => `
          <button class="option" data-i="${i}">
            <span class="marker">${String.fromCharCode(65 + i)}</span>
            <span>${opt}</span>
          </button>`
          )
          .join("")}
      </div>
      <div id="fb"></div>
    `;
    el.querySelector("#quit").addEventListener("click", () => navigate("lesson", { id: lesson.id }));
    el.querySelectorAll(".option").forEach((btn) => {
      btn.addEventListener("click", () => onAnswer(parseInt(btn.dataset.i, 10)));
    });
  }

  function onAnswer(choice) {
    if (answered) return;
    answered = true;
    const q = lesson.quiz[index];
    const isRight = choice === q.answer;
    if (isRight) correctCount++;

    el.querySelectorAll(".option").forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add("correct");
      else if (i === choice) btn.classList.add("wrong");
    });

    const fb = el.querySelector("#fb");
    fb.innerHTML = `
      <div class="feedback ${isRight ? "ok" : "ko"}">
        <strong>${isRight ? "Bravo ! 🎉" : "Pas tout à fait."}</strong> ${q.explain}
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="next">${index + 1 < total ? "Question suivante" : "Voir mon score"}</button>
      </div>
    `;
    fb.querySelector("#next").addEventListener("click", () => {
      index++;
      if (index < total) renderQuestion();
      else finish();
    });
  }

  function finish() {
    const result = store.recordQuiz(lesson, correctCount, total);
    const pct = Math.round((correctCount / total) * 100);
    const mastered = correctCount / total >= 2 / 3;

    el.innerHTML = `
      <div class="stagger reward">
        <span class="eyebrow">Quiz terminé</span>
        <h1 class="lesson-title" style="margin-bottom:16px;">${lesson.title}</h1>

        <div class="score-ring" style="--pct:${pct}%">
          <div class="inner">
            <div>
              <div class="num">${correctCount}/${total}</div>
              <div class="muted" style="font-size:.8rem;">${pct}%</div>
            </div>
          </div>
        </div>

        <div class="xp-pop">+${result.xpEarned} XP</div>

        <p style="font-size:1.05rem;margin-top:6px;">
          ${mastered ? "Sujet <strong>maîtrisé</strong> ✅" : "Presque ! Un petit tour de révision et c'est acquis."}
        </p>

        ${
          result.leveledUp
            ? `<div class="levelup">
                 <div class="lu-eyebrow">Niveau supérieur !</div>
                 <div class="lu-title">Vous êtes ${result.toTitle} 🎖️</div>
               </div>`
            : ""
        }

        ${result.newBadges
          .map(
            (b) => `
          <div class="badge-unlocked">
            <div class="bu-ic">${b.icon}</div>
            <div class="bu-txt">
              <div class="bu-title">Badge débloqué : ${b.title}</div>
              <div class="bu-desc">${b.desc}</div>
            </div>
          </div>`
          )
          .join("")}

        <div class="btn-row" style="max-width:340px;margin:22px auto 0;">
          <button class="btn btn-primary" id="continue">Continuer</button>
          <button class="btn btn-outline" id="review">Revoir la leçon</button>
        </div>
      </div>
    `;

    if (mastered || result.leveledUp || result.newBadges.length) {
      burstConfetti({ intense: result.leveledUp || correctCount === total });
    }

    el.querySelector("#continue").addEventListener("click", () => navigate("home"));
    el.querySelector("#review").addEventListener("click", () => navigate("lesson", { id: lesson.id }));
  }

  renderQuestion();
  return el;
}


/* ===== js/pages/library.js ===== */

const STATUS_LABEL = {
  todo: { cls: "todo", txt: "Non commencé" },
  progress: { cls: "progress", txt: "En cours" },
  mastered: { cls: "mastered", txt: "Maîtrisé" },
};

async function renderLibrary(params) {
  const all = await lessons.getAllLessons();
  const cats = lessons.getCategories();
  const active = params.cat || "all";

  const el = document.createElement("div");
  el.className = "stagger";

  const filtered = active === "all" ? all : all.filter((l) => l.category === active);

  const catById = Object.fromEntries(cats.map((c) => [c.id, c]));

  el.innerHTML = `
    <header class="page-head">
      <span class="eyebrow">Explorer</span>
      <h1>Bibliothèque</h1>
      <p>Choisissez un thème et progressez à votre rythme.</p>
    </header>

    <div class="filter-row">
      <button class="filter ${active === "all" ? "active" : ""}" data-cat="all">Tous</button>
      ${cats
        .map(
          (c) => `<button class="filter ${active === c.id ? "active" : ""}" data-cat="${c.id}">${c.icon} ${c.label}</button>`
        )
        .join("")}
    </div>

    <div class="topic-list">
      ${filtered
        .map((l) => {
          const st = STATUS_LABEL[store.getStatus(l.id)];
          const c = catById[l.category];
          return `
          <div class="topic" data-id="${l.id}">
            <div class="ic">${c.icon}</div>
            <div class="t-main">
              <div class="t-title">${l.title}</div>
              <div class="t-cat">${c.label} · ${l.minutes} min</div>
            </div>
            <span class="status ${st.cls}">${st.txt}</span>
          </div>`;
        })
        .join("")}
      ${filtered.length === 0 ? `<p class="muted center">Aucun sujet dans ce thème pour le moment.</p>` : ""}
    </div>
  `;

  el.querySelectorAll(".filter").forEach((btn) => {
    btn.addEventListener("click", () => navigate("library", { cat: btn.dataset.cat }));
  });
  el.querySelectorAll(".topic").forEach((t) => {
    t.addEventListener("click", () => navigate("lesson", { id: t.dataset.id }));
  });

  return el;
}

function barColor(pct) {
  if (pct >= 70) return "var(--success)";
  if (pct >= 40) return "var(--gold)";
  return "var(--danger)";
}

      <div class="stat">

      </div>
    </div>

    <h3 class="section-title">Mes badges</h3>

      <div class="badge-grid">
        ${badges
          .map(
            (b) => `
          <div class="badge ${b.earned ? "earned" : "locked"}" title="${b.desc}">
            <div class="b-ic">${b.icon}</div>
            <div class="b-name">${b.title}</div>

          )
          .join("")}
      </div>
      <p class="muted center" style="margin-top:12px;font-size:.82rem;">Touchez un badge pour voir comment l'obtenir.</p>
    </section>

    ${
      strong || weak
        ? `<h3 class="section-title">Forces & faiblesses</h3>
      <section class="card">
        ${strong ? `<div class="list-item"><span>💪 Point fort</span><strong>${strong.icon} ${strong.label} · ${strong.pct}%</strong></div>` : ""}
        ${weak && (!strong || weak.id !== strong.id) ? `<div class="list-item"><span>🎯 À travailler</span><strong>${weak.icon} ${weak.label} · ${weak.pct}%</strong></div>` : ""}
      </section>`
        : ""

    <h3 class="section-title">Maîtrise par thème</h3>

      <div class="themes">
        ${themes
          .map((t) => {
            const pct = t.pct ?? 0;
            return `

            </div>`;
          })
          .join("")}
